name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.25", "1.26"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.go-version == '1.25'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.txt
          fail_ci_if_error: false

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      # Note: staticcheck is handled by golangci-lint job with proper test exclusions

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  test-examples:
    name: Example ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - simple
          - htmx
          - htmx-render-target
          - todo
          - lint-misuse
          - blog
          - url-validation
          - html-template
        include:
          - example: url-validation
            no-gsx: true
          - example: html-template
            no-gsx: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Generate and check freshness
        if: ${{ !matrix.no-gsx }}
        working-directory: ./examples/${{ matrix.example }}
        run: |
          go run github.com/gsxhq/gsx/cmd/gsx generate -no-cache .
          if [ -n "$(git status --porcelain .)" ]; then
            echo "::error::committed .x.go files are stale — run gsx generate and commit"
            git status --porcelain .
            git diff .
            exit 1
          fi

      - name: Build
        working-directory: ./examples/${{ matrix.example }}
        run: go build ./...

      - name: Test
        working-directory: ./examples/${{ matrix.example }}
        run: go test ./...

